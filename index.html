<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teachers' Lounge</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #e8e8e8;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    /* Phone shell */
    .phone-shell {
      width: 390px;
      height: 844px;
      background: #1a1a1a;
      border-radius: 54px;
      padding: 12px;
      box-shadow:
        0 0 0 2px #3a3a3a,
        0 30px 80px rgba(0,0,0,0.45);
      position: relative;
      flex-shrink: 0;
    }

    /* Side buttons */
    .phone-shell::before {
      content: '';
      position: absolute;
      left: -3px;
      top: 140px;
      width: 3px;
      height: 36px;
      background: #3a3a3a;
      border-radius: 2px 0 0 2px;
      box-shadow: 0 50px 0 #3a3a3a, 0 100px 0 #3a3a3a;
    }

    .phone-shell::after {
      content: '';
      position: absolute;
      right: -3px;
      top: 180px;
      width: 3px;
      height: 64px;
      background: #3a3a3a;
      border-radius: 0 2px 2px 0;
    }

    /* Screen */
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #fff;
      border-radius: 44px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 28px 0;
      font-size: 13px;
      font-weight: 600;
      color: #000;
      flex-shrink: 0;
    }

    .status-icons {
      display: flex;
      gap: 6px;
      align-items: center;
      font-size: 12px;
    }

    /* Dynamic island */
    .dynamic-island {
      width: 120px;
      height: 34px;
      background: #1a1a1a;
      border-radius: 20px;
      margin: 0 auto;
      flex-shrink: 0;
    }

    /* App content */
    .app-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 32px 48px;
    }

    .logo-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 48px;
    }

    .mugs img {
      width: 180px;
      margin-bottom: 8px;
    }

    .app-name {
      font-family: 'Caveat', cursive;
      font-size: 40px;
      font-weight: 700;
      color: #1a6b72;
      text-align: center;
      line-height: 1.15;
      margin-top: 8px;
    }

    .buttons {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 50px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-outline {
      background: transparent;
      border: 2px solid #1a6b72;
      color: #1a6b72;
    }

    .btn-filled {
      background: #1a6b72;
      border: 2px solid #1a6b72;
      color: #fff;
    }

    /* Home indicator */
    .home-indicator {
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .home-indicator-bar {
      width: 120px;
      height: 5px;
      background: #000;
      border-radius: 3px;
      opacity: 0.2;
    }
  </style>
</head>
<body>
  <div class="phone-shell">
    <div class="phone-screen">

      <div class="status-bar">
        <span>9:41</span>
        <div class="dynamic-island"></div>
        <div class="status-icons">
          <span>●●●</span>
          <span>WiFi</span>
          <span>▌▌</span>
        </div>
      </div>

      <div class="app-content">
        <div class="logo-area">
          <div class="mugs">
            <img src="assets/Teacher'sLoungeLogo 2.png" alt="Teachers' Lounge Logo">
          </div>
          <div class="app-name">Teachers'<br>Lounge</div>
        </div>

        <div class="buttons">
          <button class="btn btn-outline">Log In</button>
          <button class="btn btn-filled" onclick="window.location.href='signup.html'">Sign Up</button>
        </div>
      </div>

      <div class="home-indicator">
        <div class="home-indicator-bar"></div>
      </div>

    </div>
  </div>
</body>
</html>
