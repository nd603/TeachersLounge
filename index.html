<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: sans-serif;
      background: #f0f0f0;
    }
    h1 {
      margin-bottom: 24px;
      font-size: 2.5rem;
      color: #222;
    }
    button {
      padding: 12px 28px;
      font-size: 1rem;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
    }
    button:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
  <button onclick="alert('You clicked me')">Click Me</button>
  <button onclick="alert('good job')" style="margin-top: 12px;">Click me too</button>
</body>
</html>
